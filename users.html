<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Team Management</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet"
href="css/style.css">

<link rel="stylesheet"
href="css/users.css">

<link rel="stylesheet"
href="css/responsive.css">

</head>

<body>

<div class="dashboard-layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            <h2>TaskFlow</h2>
        </div>

        <ul>

            <li>
                <a href="dashboard.html">
                    <i class="fas fa-chart-line"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="projects.html">
                    <i class="fas fa-folder"></i>
                    Projects
                </a>
            </li>

            <li>
                <a href="tasks.html">
                    <i class="fas fa-list-check"></i>
                    Tasks
                </a>
            </li>

            <li>
                <a href="kanban.html">
                    <i class="fas fa-table-columns"></i>
                    Kanban
                </a>
            </li>

            <li>
                <a href="analytics.html">
                    <i class="fas fa-chart-pie"></i>
                    Analytics
                </a>
            </li>

            <li>
                <a href="users.html">
                    <i class="fas fa-users"></i>
                    Team
                </a>
            </li>

            <li>
                <a href="#"
                onclick="toggleTheme()">

                    <i class="fas fa-moon"></i>
                    Dark Mode

                </a>
            </li>

            <li>
                <a href="#"
                onclick="logout()">

                    <i class="fas fa-right-from-bracket"></i>
                    Logout

                </a>
            </li>

        </ul>

    </aside>


    <!-- Main Content -->

    <main class="main-content">

        <div class="topbar">

            <h1>
                Team Management
            </h1>

            <div class="topbar-right">

                <button
                class="icon-btn"
                onclick="toggleTheme()">

                    <i class="fas fa-moon"></i>

                </button>

            </div>

        </div>


        <!-- Add User -->

        <div class="user-form-card">

            <h2>
                Create Team Member
            </h2>

            <form id="userForm">

                <input
                type="text"
                id="userName"
                placeholder="User Name"
                required>

                <input
                type="email"
                id="userEmail"
                placeholder="Email Address"
                required>

                <select id="role">

                    <option value="Admin">
                        Admin
                    </option>

                    <option value="Manager">
                        Manager
                    </option>

                    <option value="Developer">
                        Developer
                    </option>

                    <option value="Tester">
                        Tester
                    </option>

                </select>

                <button type="submit">
                    Add Member
                </button>

            </form>

        </div>


        <!-- Team Members -->

        <div class="user-section">

            <h2>
                Team Members
            </h2>

            <div
            id="userContainer"
            class="user-container">

            </div>

        </div>

    </main>

</div>

<script src="js/app.js"></script>
<script src="js/users.js"></script>

</body>

</html>
